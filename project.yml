name: CozyShopkeeper
options:
  bundleIdPrefix: com.surproductions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  ShopCore:
    path: ShopCore
targets:
  CozyShopkeeper:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: ShopCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cozy Shopkeeper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.cozyshopkeeper
        PRODUCT_NAME: CozyShopkeeper
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  CozyShopkeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: CozyShopkeeper
      - package: ShopCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.cozyshopkeeper.tests
  CozyShopkeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: CozyShopkeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.cozyshopkeeper.uitests
schemes:
  CozyShopkeeper:
    build:
      targets:
        CozyShopkeeper: all
    run:
      config: Debug
      storeKitConfiguration: App/CozyShopkeeper.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CozyShopkeeperTests
        - CozyShopkeeperUITests
    archive:
      config: Release
