name: iOS build, test & IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: CozyShopkeeper
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          mkdir -p build/logs artifacts
          { xcodebuild -version; swift --version; sw_vers; } | tee build/logs/00-toolchain.txt

      - name: Core logic tests (ShopCore)
        run: |
          set -o pipefail
          swift test --package-path ShopCore 2>&1 | tee build/logs/01-shopcore-tests.txt

      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate 2>&1 | tee build/logs/02-xcodegen.txt

      - name: Build & archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CozyShopkeeper.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/CozyShopkeeper.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/03-archive.txt | grep -E "error:|warning: |\*\* ARCHIVE" || true
          test -d build/CozyShopkeeper.xcarchive/Products/Applications/CozyShopkeeper.app

      - name: Package unsigned IPA
        run: |
          APP=build/CozyShopkeeper.xcarchive/Products/Applications/CozyShopkeeper.app
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry ../artifacts/Cozy-Shopkeeper-unsigned.ipa Payload)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          { echo "version=$VERSION build=$BUILD bundle=$BUNDLE"; ls -la artifacts; unzip -l artifacts/Cozy-Shopkeeper-unsigned.ipa | tail -5; } | tee build/logs/04-package.txt

      - name: Signed IPA (only when signing secrets are configured)
        id: signed
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ] || [ -z "$TEAM_ID" ]; then
            echo "Signing secrets not configured — skipping signed export." | tee build/logs/05-signing.txt
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci_sign_and_export.sh 2>&1 | tee build/logs/05-signing.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: (cd artifacts && shasum -a 256 *.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-build.${APP_BUILD}"
          SIGNED="${{ steps.signed.outputs.signed }}"
          {
            echo "Cozy Shopkeeper ${VERSION} (build ${APP_BUILD}) — commit ${GITHUB_SHA::7}"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "**Cozy-Shopkeeper.ipa** is signed with the configured certificate and provisioning profile."
            else
              echo "**Cozy-Shopkeeper-unsigned.ipa is not signed.** It must be signed before it can be installed — e.g. with a sideloading tool (Sideloadly, AltStore) using your Apple ID, or by configuring the signing secrets described in the README."
            fi
            echo
            echo "Core logic tests passed before packaging. Simulator test results are added below once they finish."
            echo
            echo "SHA-256:"
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
          } > build/release-notes.md
          gh release create "$TAG" artifacts/*.ipa artifacts/SHA256SUMS.txt \
            --title "Cozy Shopkeeper ${VERSION} (${APP_BUILD})" --notes-file build/release-notes.md --prerelease \
            --target "$GITHUB_SHA"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Simulator tests (unit + UI smoke test)
        id: simtests
        continue-on-error: true
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 scripts/ci_pick_simulator.py)
          echo "Using simulator $DEVICE_ID" | tee build/logs/06-simulator-tests.txt
          xcodebuild test -project CozyShopkeeper.xcodeproj -scheme "$SCHEME" \
            -destination "id=$DEVICE_ID" -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a build/logs/06-simulator-tests.txt | grep -E "Test Case|error:|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/logs/06-simulator-tests.txt

      - name: Record simulator test result on the release
        if: always() && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY=$(grep -E "Executed [0-9]+ tests?" build/logs/06-simulator-tests.txt | tail -1 || true)
          if [ "${{ steps.simtests.outcome }}" = "success" ]; then
            STATUS="✅ Simulator unit + UI tests passed. ${SUMMARY}"
            gh release edit "$TAG" --prerelease=false
          else
            STATUS="⚠️ Simulator tests did not pass (${SUMMARY:-see logs}). This build stays marked as a pre-release."
          fi
          gh release view "$TAG" --json body -q .body > build/notes-now.md
          printf "\n\n%s\n" "$STATUS" >> build/notes-now.md
          gh release edit "$TAG" --notes-file build/notes-now.md

      - name: Publish build logs to a ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/logs && cp -R build/logs/. /tmp/logs/
          cd /tmp/logs
          tail -c 200000 03-archive.txt > 03-archive-tail.txt 2>/dev/null; rm -f 03-archive.txt
          grep -nE "error:|warning: " /tmp/logs/03-archive-tail.txt > 03-archive-issues.txt 2>/dev/null
          if [ -f 06-simulator-tests.txt ]; then tail -c 300000 06-simulator-tests.txt > 06-tail.txt; mv 06-tail.txt 06-simulator-tests.txt; fi
          echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} job_status=${{ job.status }}" > STATUS.txt
          git init -q && git checkout -q -b logs
          git config user.name "ci-logs" && git config user.email "ci-logs@users.noreply.github.com"
          git add -A && git commit -qm "CI logs for run ${GITHUB_RUN_NUMBER}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/ci-logs/run-${GITHUB_RUN_NUMBER}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozy-shopkeeper-${{ github.run_number }}
          path: |
            artifacts/
            build/logs/
          retention-days: 14
