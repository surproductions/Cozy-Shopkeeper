name: iOS build, test & IPA
# Builds, tests, packages and uploads the iOS app (TestFlight) on a GitHub-hosted macOS runner.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: CozyShopkeeper
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (App Store requires Xcode 26+)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vE "beta|Beta|_RC" | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then echo "::error::Newest Xcode on this runner is $MAJOR; App Store uploads need Xcode 26+"; exit 1; fi

      - name: Toolchain info
        run: |
          mkdir -p build/logs artifacts
          { xcodebuild -version; swift --version; sw_vers; } | tee build/logs/00-toolchain.txt

      - name: Core logic tests (ShopCore)
        run: |
          set -o pipefail
          swift test --package-path ShopCore 2>&1 | tee build/logs/01-shopcore-tests.txt

      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate 2>&1 | tee build/logs/02-xcodegen.txt

      - name: Build & archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CozyShopkeeper.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/CozyShopkeeper.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/03-archive.txt | grep -E "error:|warning: |\*\* ARCHIVE" || true
          test -d build/CozyShopkeeper.xcarchive/Products/Applications/CozyShopkeeper.app

      - name: Package unsigned IPA
        run: |
          APP=build/CozyShopkeeper.xcarchive/Products/Applications/CozyShopkeeper.app
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry ../artifacts/Cozy-Shopkeeper-unsigned.ipa Payload)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          { echo "version=$VERSION build=$BUILD bundle=$BUNDLE"; ls -la artifacts; unzip -l artifacts/Cozy-Shopkeeper-unsigned.ipa | tail -5; } | tee build/logs/04-package.txt

      - name: App Store signed IPA (needs APPLE_TEAM_ID + ASC_* secrets)
        id: signed
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "App Store secrets not configured — skipping signed export." | tee build/logs/05-signing.txt
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          if scripts/ci_appstore.sh > build/logs/05-signing-full.txt 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "SIGNING FAILED"
          fi
          head -5 build/logs/05-signing-full.txt > build/logs/05-signing.txt
          echo "--- notable lines" >> build/logs/05-signing.txt
          grep -E "error|Error|warning: |codesign|Authority|TeamIdentifier|ARCHIVE|EXPORT|Exported|^[0-9]+$|API key|ASC_KEY|Signing|signing|provision|certificate" build/logs/05-signing-full.txt | grep -v "^    " | tail -150 >> build/logs/05-signing.txt || true
          echo "--- last lines" >> build/logs/05-signing.txt
          tail -60 build/logs/05-signing-full.txt >> build/logs/05-signing.txt
          rm -f build/logs/05-signing-full.txt

      - name: Upload to App Store Connect (TestFlight)
        id: upload
        if: steps.signed.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if scripts/ci_upload.sh > build/logs/07-upload.txt 2>&1; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi
          tail -80 build/logs/07-upload.txt

      - name: Checksums
        run: (cd artifacts && shasum -a 256 *.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-build.${APP_BUILD}"
          SIGNED="${{ steps.signed.outputs.signed }}"
          {
            echo "Cozy Shopkeeper ${VERSION} (build ${APP_BUILD}) — commit ${GITHUB_SHA::7}"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "**Cozy-Shopkeeper-AppStore.ipa** is signed for App Store distribution (TestFlight / App Store). It cannot be sideloaded."
              if [ "${{ steps.upload.outputs.uploaded }}" = "true" ]; then
                echo "It was uploaded to App Store Connect and will appear in TestFlight after Apple finishes processing."
              else
                echo "Upload to App Store Connect did not succeed — see ci-logs/run-${GITHUB_RUN_NUMBER}/07-upload.txt."
              fi
              echo
            fi
            echo "**Cozy-Shopkeeper-unsigned.ipa** is not signed; install it with Sideloadly or AltStore using your Apple ID."
            echo
            echo "Core logic tests passed before packaging. Simulator test results are added below once they finish."
            echo
            echo "SHA-256:"
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
          } > build/release-notes.md
          gh release create "$TAG" artifacts/*.ipa artifacts/SHA256SUMS.txt \
            --title "Cozy Shopkeeper ${VERSION} (${APP_BUILD})" --notes-file build/release-notes.md --prerelease \
            --target "$GITHUB_SHA"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Simulator tests (unit + UI smoke test)
        id: simtests
        continue-on-error: true
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 scripts/ci_pick_simulator.py)
          echo "Using simulator $DEVICE_ID" | tee build/logs/06-simulator-tests.txt
          xcodebuild test -project CozyShopkeeper.xcodeproj -scheme "$SCHEME" \
            -destination "id=$DEVICE_ID" -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a build/logs/06-simulator-tests.txt | grep -E "Test Case|error:|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/logs/06-simulator-tests.txt

      - name: Record simulator test result on the release
        if: always() && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY=$(grep -E "Executed [0-9]+ tests?" build/logs/06-simulator-tests.txt | tail -1 || true)
          if [ "${{ steps.simtests.outcome }}" = "success" ]; then
            STATUS="✅ Simulator unit + UI tests passed. ${SUMMARY}"
            gh release edit "$TAG" --prerelease=false
          else
            STATUS="⚠️ Simulator tests did not pass (${SUMMARY:-see logs}). This build stays marked as a pre-release."
          fi
          gh release view "$TAG" --json body -q .body > build/notes-now.md
          printf "\n\n%s\n" "$STATUS" >> build/notes-now.md
          gh release edit "$TAG" --notes-file build/notes-now.md

      - name: App Store screenshots (6.9-inch iPhone)
        continue-on-error: true
        run: scripts/ci_screenshots.sh 2>&1 | tail -30 | tee build/logs/08-screenshots.txt

      - name: Publish build logs to a ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/logs && cp -R build/logs/. /tmp/logs/
          if [ -d build/screenshots ]; then cp -R build/screenshots /tmp/logs/screenshots; fi
          cd /tmp/logs
          tail -c 200000 03-archive.txt > 03-archive-tail.txt 2>/dev/null; rm -f 03-archive.txt
          grep -nE "error:|warning: " /tmp/logs/03-archive-tail.txt > 03-archive-issues.txt 2>/dev/null
          if [ -f 06-simulator-tests.txt ]; then tail -c 300000 06-simulator-tests.txt > 06-tail.txt; mv 06-tail.txt 06-simulator-tests.txt; fi
          echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} job_status=${{ job.status }}" > STATUS.txt
          git init -q && git checkout -q -b logs
          git config user.name "ci-logs" && git config user.email "ci-logs@users.noreply.github.com"
          git add -A && git commit -qm "CI logs for run ${GITHUB_RUN_NUMBER}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/ci-logs/run-${GITHUB_RUN_NUMBER}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozy-shopkeeper-${{ github.run_number }}
          path: |
            artifacts/
            build/logs/
            build/screenshots/
          retention-days: 14
